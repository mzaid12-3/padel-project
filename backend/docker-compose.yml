services:
  postgres:
    image: postgres:16
    container_name: padel-postgres
    environment:
      POSTGRES_DB: padel_draft
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: padel-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
